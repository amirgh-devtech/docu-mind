[project]
name = "docu-mind"
version = "0.1.0"
description = "Personal document assistant with real RAG — upload PDF/Word/Markdown, ask questions, get cited answers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "AmirMohammad Ghasemzadeh", email = "AmirGh.DevTech@gmail.com" },
]
keywords = [
    "rag",
    "llm",
    "pgvector",
    "fastapi",
    "document-ai",
    "retrieval",
    "embeddings",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

# ─────────────────────────────────────────────
# Runtime dependencies
# ─────────────────────────────────────────────
dependencies = [
    # --- Web / API ---
    "fastapi>=0.133.0,<0.134",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12",      # file uploads
    "sse-starlette>=2.1,<3.0",       # Server-Sent Events for streaming
    "httpx>=0.27,<0.28",

    # --- Config / Validation ---
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",

    # --- LLM abstraction (multi-provider) ---
    "litellm>=1.55,<2.0", # OpenAI/Anthropic/Gemini/Groq/...
    "tiktoken>=0.8,<0.9", # token counting for context window mgmt

    # --- DB (Postgres + pgvector) ---
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "greenlet>=3.1,<4.0",
    "pgvector>=0.3.6,<0.4",             # pgvector Python adapter

    # --- Document parsers ---
    "pymupdf>=1.25,<2.0",        # PDF
    "python-docx>=1.1,<2.0",     # Word (.docx)
    "markdown-it-py>=3.0,<4.0",  # Markdown structured parsing
    "beautifulsoup4>=4.12,<5.0", # HTML cleaning
    "lxml>=6.1.0,<7.0",

    # --- Embedding ---
    "openai>=1.55,<2.0",

    # --- Reranker ---
    "sentence-transformers>=3.3,<4.0", # local cross-encoder (Eco mode)
    "cohere>=5.13,<6.0",               # Cohere Rerank (Pro mode)

    # --- RAG evaluation (pinned to avoid langchain-community 0.4 breaking ragas) ---
    "langchain-community<0.4",

    # --- Observability ---
    "structlog>=24.4,<25.0",
    "prometheus-client>=0.21,<0.22",

    # --- Utils ---
    "python-dateutil>=2.9,<3.0",
    "orjson>=3.10,<4.0",
    "typing-extensions>=4.12,<5.0",
    "tenacity>=9.0,<10.0",          # retry with backoff
]

# ─────────────────────────────────────────────
# Dev dependencies
# ─────────────────────────────────────────────
[dependency-groups]
dev = [
    # Testing
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.3.0,<2.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "httpx>=0.27,<0.28",
    "faker>=30.0,<31.0",
    "freezegun>=1.5,<2.0",
    "testcontainers[postgres]>=4.8,<5.0",

    # Lint / Format
    "ruff>=0.8,<0.9",

    # Type checking
    "mypy>=1.13,<2.0",
    "types-python-dateutil>=2.9",
    "types-requests>=2.32",
    "types-beautifulsoup4>=4.12",

    # Pre-commit
    "pre-commit>=4.0,<5.0",

    # RAG Evaluation
    "ragas>=0.2,<0.3",    # faithfulness, answer correctness, context precision
    "datasets>=3.2,<4.0", # ragas dependency

    # Dev tooling
    "ipython>=8.30,<9.0",
    "rich>=13.9,<14.0",
    "watchfiles>=1.0,<2.0",
]

# ─────────────────────────────────────────────
# Build system
# ─────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docu_mind"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]

# ─────────────────────────────────────────────
# uv
# ─────────────────────────────────────────────
[tool.uv]
package = true
default-groups = ["dev"]

# ─────────────────────────────────────────────
# Ruff
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "S",     # flake8-bandit
    "T20",   # flake8-print (no print statements)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "TID",   # flake8-tidy-imports
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PL",    # pylint
]
ignore = [
    "PLR0913", # too many args
    "PLR2004", # magic value comparison
    "S101",    # assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "ARG001", "ARG002", "PLR2004"]
"migrations/**/*.py" = ["E501", "I001", "N999"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["docu_mind"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ─────────────────────────────────────────────
# Mypy
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

exclude = ["^migrations/versions/.*", "^build/", "^dist/"]

[[tool.mypy.overrides]]
# Modules without type stubs — silence missing-import errors.
module = [
    "litellm.*",
    "ragas.*",
    "datasets.*",
    "sentence_transformers.*",
    "pymupdf.*",
    "docx.*",
    "markdown_it.*",
    "testcontainers.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests (fast, no external deps)",
    "integration: integration tests (need Postgres)",
    "e2e: end-to-end tests",
    "eval: RAG evaluation tests (need LLM API)",
    "slow: slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:ragas.*",
    "ignore::pytest.PytestConfigWarning",
]

[tool.coverage.run]
branch = true
source = ["src/docu_mind"]
omit = ["*/tests/*", "*/migrations/*", "*/__main__.py"]
disable_warnings = ["no-data-collected", "module-not-imported"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
